name: Create new release files for DartsCounter

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalace .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kompilace pro Windows (více souborů)
        run: dotnet publish DesktopUI/DesktopUI.csproj -c Release -r win-x64 --self-contained true -o publish-win

      - name: Sestavení MSI instalátoru
        run: dotnet build installer.wixproj -c Release -p:Platform=x64

      - name: Generování kontrolního součtu SHA-256
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "DartsCounter.msi" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$($_.FullName).sha256" -Value "$hash  DartsCounter.msi"
          }

      - name: Nahrát soubor do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/DartsCounter.msi
            **/DartsCounter.msi.sha256

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalace .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kompilace pro macOS
        run: dotnet publish DesktopUI/DesktopUI.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true -o DartsCounter.app/Contents/MacOS

      - name: Vytvoření DMG obrazu
        run: hdiutil create -volname "DartsCounter" -srcfolder DartsCounter.app -ov -format UDZO DartsCounter.dmg

      - name: Generování kontrolního součtu SHA-256
        run: shasum -a 256 DartsCounter.dmg > DartsCounter.dmg.sha256

      - name: Nahrát soubor do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DartsCounter.dmg
            DartsCounter.dmg.sha256

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Instalace .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Kompilace pro Linux
        run: dotnet publish DesktopUI/DesktopUI.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o AppDir/usr/bin

      - name: Příprava struktury pro AppImage
        run: |
          chmod +x AppDir/usr/bin/DartsCounter
          
          echo '#!/bin/sh' > AppDir/AppRun
          echo 'HERE="$(dirname "$(readlink -f "${0}")")"' >> AppDir/AppRun
          echo 'exec "${HERE}/usr/bin/DartsCounter" "$@"' >> AppDir/AppRun
          chmod +x AppDir/AppRun
          
          echo "[Desktop Entry]
          Name=Darts Counter
          Name[cs]=Šipky
          Exec=DartsCounter
          Icon=DartsCounter
          Type=Application
          Categories=Game;" > AppDir/DartsCounter.desktop
          
          cp DesktopUI/Assets/IcoFiles/Darts.ico AppDir/DartsCounter.png 

      - name: Vytvoření AppImage
        run: |
          wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool --appimage-extract-and-run AppDir DartsCounter.AppImage

      - name: Generování kontrolního součtu SHA-256
        run: sha256sum DartsCounter.AppImage > DartsCounter.AppImage.sha256

      - name: Nahrát soubor do GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DartsCounter.AppImage
            DartsCounter.AppImage.sha256